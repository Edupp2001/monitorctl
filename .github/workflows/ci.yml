name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: tidy check
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: build
        run: go build -trimpath ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest