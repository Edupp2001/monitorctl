allow_read = [
  "/etc/ld.so.cache",
  "/etc/passwd",
  "/etc/hostname",
  "/etc/nsswitch.conf",
  "/etc/resolv.conf",
  "/dev/null",
  "/dev/urandom",
]

allow_write = [
  "/tmp",
]

allow_all = [
  "/lib",
  "/lib64",
  "/usr/lib",
  "/usr/lib64",
  "/usr/share/locale",
  "/bin/ls",
  "/usr/bin/ls",
  "/bin/cat",
  "/usr/bin/cat",
  "/bin/sh",
  "/bin/bash",
  "/usr/bin/sleep",
]