version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - gosec

      - path: '^internal/linux/cgroup/'
        text: 'G30[0146]:'
        linters:
          - gosec

      - path: '^internal/config/'
        text: 'G30[0146]:'
        linters:
          - gosec
      - path: '^internal/logger/'
        text: 'G30[0146]:'
        linters:
          - gosec

      - path: '^internal/linux/landlock/'
        text: 'G103:'
        linters:
          - gosec

      - path: '^internal/linux/supervisor/'
        text: 'G204:'
        linters:
          - gosec
      # cmd/monitorctl: cgroup.procs path built from grp.Path, not user input.
      - path: '^cmd/monitorctl/'
        text: 'G(304|306):'
        linters:
          - gosec

      # supervisor: same (cgroup.procs); pid conversion is safe on Linux.
      - path: '^internal/linux/supervisor/'
        text: 'G(115|304|306):'
        linters:
          - gosec
formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0